# ============================================
# 应用配置文件（YAML 格式：缩进表示层级）
# ============================================
server:
  port: 8080

spring:
  application:
    name: sseat
  # 激活本机个人配置（application-local.yml 不入库，见 .gitignore；
  # 新克隆本工程的人：复制 application-local.example.yml 为 application-local.yml 填入自己的密码即可运行）
  profiles:
    active: local
  # ---------- 数据库连接 ----------
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    # sseat_db 是库名；?后面是参数：编码utf8mb4、时区东八区、允许批量重写
    # 注意：characterEncoding 填的是 Java 侧字符集名 utf8（MySQL 驱动会自动对应到 utf8mb4），
    # 填 utf8mb4 会报 Unsupported character encoding
    url: jdbc:mysql://localhost:3306/sseat_db?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&allowMultiQueries=true
    username: root
    password: ${MYSQL_PASSWORD:}
  # ---------- Redis（登录安全计数 / 图形验证码答案存储） ----------
  data:
    redis:
      host: localhost
      port: 6379
      # 开发默认无密码；连接超时
      timeout: 3s
      lettuce:
        pool:
          # 连接池生效需 classpath 有 commons-pool2（见 pom 注释）；不配则用默认共享单连接多路复用
          max-active: 8      # 最多同时 8 条连接
          max-wait: 2s       # 池耗尽时最多等 2 秒，宁可报错也不无限阻塞
  # ---------- 文件上传大小限制 ----------
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 20MB
  # 日期时间序列化成字符串而不是时间戳
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: GMT+8

# ---------- MyBatis-Plus ----------
mybatis-plus:
  configuration:
    # 数据库下划线字段(user_name) 自动映射 Java 驼峰属性(userName)
    map-underscore-to-camel-case: true
    # 控制台打印执行的 SQL，方便学习和调试
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      id-type: auto          # 主键自增
      logic-delete-field: deleted   # 预留：逻辑删除字段（暂不启用）

# ---------- 自定义配置（对应代码里的 @Value） ----------
sseat:
  jwt:
    # JWT 签名密钥（HS512 要求至少64字符）。真实密钥放 application-local.yml（不入库）；
    # 这里的占位串仅供克隆者未配置 local 文件时不至于启动崩溃（签出的令牌自然无效）
    secret: ${JWT_SECRET:CHANGE_ME-create-application-local-yml-or-set-env-JWT_SECRET-with-64-plus-random-chars}
    # 令牌有效期（小时）
    expire-hours: 24
  upload:
    # 图片上传的本地保存目录（会自动创建）
    dir: "D:/tmp/sseat-uploads/"
    # 前端访问图片的 URL 前缀
    url-prefix: "/uploads/"
  captcha:
    # 开发模式：验证码接口额外返回明文答案，方便自动化测试与自测；
    # 答辩/交付前改为 false（前端演示时人工看图输入，不影响功能）
    debug-reveal: true
  sms:
    # 短信模拟开关：true=不发真实短信，验证码固定/打日志
    mock: true
    # 模拟模式下的固定验证码
    mock-code: "8888"
